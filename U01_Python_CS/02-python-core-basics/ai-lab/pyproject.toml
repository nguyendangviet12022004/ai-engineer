[project]
name = "ai-lab"
version = "0.1.0"
description = "U01-02 Python core basics: list/dict/string helper exercises"
readme = "README.md"
authors = [
    { name = "nguyendangviet12022004", email = "viet.ngdang.dev@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "regex>=2026.9.3",
]

[project.scripts]
ai-lab = "ai_lab.main:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
